server:
  port: 8082

spring:
  application:
    name: vehicle-service
  config:
    import: configserver:http://localhost:8888
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/spms_vehicle_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQLDialect

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true
    instance:
      prefer-ip-address: true

  management:
    endpoints:
      web:
        exposure:
          include: "*"