server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./config-repo
            - file:../config-repo
            - file:../../config-repo
            - classpath:/config-repo
  profiles:
    active: native

management:
  endpoints:
    web:
      exposure:
        include: "*"